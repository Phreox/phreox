# Releases the website (phreox.com) on its own: it has its own tags and does not wait for, or trigger, a release of the apps.
#
#   tag website-1.2.3   ->  release "Phreox Website 1.2.3" in Phreox/releases with phreox-website-1.2.3.tar.gz and SHA256SUMS
#
# The egg "Phreox Website" (pterodactyl/egg-phreox-website.json) takes the newest website-X.Y.Z at installation and at every start.
# The tag does not look like a version of an app, so the updaters of the apps and the service never see it as theirs.
#
# Secrets: RELEASES_TOKEN (write access to the contents of Phreox/releases, required), SUBMODULES_TOKEN (read access to the submodules,
# only if they are private). The website renders the news with the Markdown component of phreox-frontend, so that submodule is needed.
name: website

on:
  push:
    tags:
      - "website-[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the prefix, e.g. 1.2.3 (the release is tagged website-1.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASES_REPO: Phreox/releases

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/website-* ]]; then version="${GITHUB_REF_NAME#website-}"; else version="${{ inputs.version }}"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::'$version' is not a version like 1.2.3"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        run: |
          (cd phreox-website && npm ci && npm run build)
          mkdir -p pack out
          cp -r phreox-website/dist pack/site
          cp phreox-website/server/server.mjs pack/server.mjs
          tar -czf "out/phreox-website-${{ steps.version.outputs.version }}.tar.gz" -C pack .
          (cd out && sha256sum phreox-website-* > SHA256SUMS)
      - name: Publish
        shell: bash
        run: |
          tag="website-${{ steps.version.outputs.version }}"
          # A rerun replaces its own release.
          gh release delete "$tag" -R "$RELEASES_REPO" --cleanup-tag --yes || true
          # Not "latest": that place belongs to the apps.
          gh release create "$tag" out/* -R "$RELEASES_REPO" --title "Phreox Website ${{ steps.version.outputs.version }}" \
            --notes "The website of phreox.com. Built from https://github.com/${{ github.repository }}/commit/${{ github.sha }}" --latest=false
