# Builds every channel of the apps and publishes them to https://github.com/Phreox/releases.
#
#   push to the main branch   ->  pre-release 1.0.0-dev.<8 chars of the commit>, channel dev; only one dev release exists at a time
#   tag 1.2.3                 ->  normal release, channel release (the stable app)
#   tag 1.2.3-beta.N / -pre.N / -rc.N       ->  pre-release, channel beta
#   tag 1.2.3-alpha.N / -pre.alpha.N        ->  pre-release, channel alpha
#
# Each channel is an app of its own (own id, name and data). Release, beta and alpha talk to the real services so their accounts
# are the same; dev has services of its own. See phreox-app/channels.json and docs/RELEASES.md.
#
# The Windows installer (exe) and the macOS image (dmg) are built after the release exists and added to it, so the release does not wait
# for their runners.
#
# The service, the backend and the web version are published too, as phreox-service-*.jar, phreox-backend-*.jar and
# phreox-web-*.tar.gz: the Pterodactyl eggs in pterodactyl/ install and update themselves from them.
#
# Secrets: RELEASES_TOKEN (write access to the contents of Phreox/releases, required), SUBMODULES_TOKEN (read access to the
# submodules, only if they are private), ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS (the key every
# Android build is signed with, so that an installed app can be updated).
name: publish

on:
  push:
    branches: [master, main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the branch makes an older run pointless: it would publish a dev release that is replaced at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  RELEASES_REPO: Phreox/releases

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: info
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node phreox-app/scripts/release-info.mjs "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          else
            short="${GITHUB_SHA:0:8}"
            {
              echo "tag=1.0.0-dev.$short"
              echo "version=1.0.0-dev.$short"
              echo "channel=dev"
              echo "prerelease=true"
            } | tee -a "$GITHUB_OUTPUT"
          fi

  # libopus 1.6.1 (our own build, the one with DRED) and PortAudio for every platform. Windows and macOS have neither, so without these the sound of a
  # voice channel does not work there. It is a workflow of its own (natives.yml) so that it can be run alone while it is worked on; a platform that
  # fails to build does not stop a release, the jar just goes without the natives of that platform (as it did before).
  natives:
    uses: ./.github/workflows/natives.yml
    secrets: inherit

  desktop:
    needs: [plan, natives]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: libopus and PortAudio of every platform
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: natives-*
          merge-multiple: true
          path: phreox-backend/src/main/resources/natives
      - name: Backend jar and the Java runtime that ships with the app
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          node phreox-app/scripts/make-runtime.mjs
      - name: Make this checkout the app of the channel
        working-directory: phreox-app
        env:
          PHREOX_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: node scripts/prepare-channel.mjs "${{ needs.plan.outputs.channel }}" "${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install
        run: |
          (cd phreox-frontend && npm ci)
          (cd phreox-app && npm install --no-audit --no-fund)
      - name: Package
        working-directory: phreox-app
        run: npm run package:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            phreox-app/release/phreox-*.AppImage

  android:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make this checkout the app of the channel
        working-directory: phreox-app
        env:
          PHREOX_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: node scripts/prepare-channel.mjs "${{ needs.plan.outputs.channel }}" "${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
      - name: Build the web part
        run: |
          (cd phreox-frontend && npm ci)
          (cd phreox-app && npm install --no-audit --no-fund && npm run sync:android)
      - name: Signing key
        id: key
        run: |
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/phreox.jks"
          else
            # Without the shared key the app installs, but cannot be updated over an older build: say so.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK is signed with a throwaway key and cannot update an installed app"
            keytool -genkeypair -keystore "$RUNNER_TEMP/phreox.jks" -storepass throwaway -keypass throwaway -alias phreox -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Phreox CI"
          fi
      - name: APK
        working-directory: phreox-app/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'throwaway' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'phreox' }}
        run: |
          # The version code grows with every build, so a newer build can always be installed over an older one.
          ./gradlew --no-daemon assembleRelease \
            -PphreoxApplicationId="$PHREOX_APP_ID" -PphreoxAppName="$PHREOX_APP_NAME" -PphreoxScheme="$PHREOX_SCHEME" \
            -PphreoxVersionName="${{ needs.plan.outputs.version }}" -PphreoxVersionCode="${{ github.run_number }}" \
            -PphreoxKeystore="$RUNNER_TEMP/phreox.jks" -PphreoxKeystorePassword="$STORE_PASSWORD" -PphreoxKeyAlias="$KEY_ALIAS"
          mv app/build/outputs/apk/release/app-release.apk \
            "phreox-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: phreox-app/android/phreox-*.apk

  service:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: phreox-service.jar
        run: |
          mvn -B -q -pl phreox-service -am -DskipTests package
          mkdir -p out
          # The Pterodactyl egg and its supervisor take this file: phreox-service-<channel>-<version>.jar
          cp phreox-service/target/phreox-service.jar "out/phreox-service-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: service
          if-no-files-found: error
          path: out/phreox-service-*.jar

  backend:
    needs: [plan, natives]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: libopus and PortAudio of every platform
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: natives-*
          merge-multiple: true
          path: phreox-backend/src/main/resources/natives
      - name: phreox-backend.jar
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          mkdir -p out
          # The Pterodactyl egg "Phreox Backend" takes this file: phreox-backend-<channel>-<version>.jar
          cp phreox-backend/target/phreox-backend.jar "out/phreox-backend-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          if-no-files-found: error
          path: out/phreox-backend-*.jar

  # The space node, for own servers and the self-updating Docker container (docker/space-node).
  space:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: phreox-space.jar
        run: |
          mvn -B -q -pl phreox-space -am -DskipTests package
          mkdir -p out
          cp phreox-space/target/phreox-space.jar "out/phreox-space-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: space
          if-no-files-found: error
          path: out/phreox-space-*.jar

  # The web version (phreox.talk): the built app and the small server that serves it. The egg "Phreox Web" takes this archive.
  web:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        env:
          VITE_PHREOX_WEB: "1"
          VITE_PHREOX_CHANNEL: ${{ needs.plan.outputs.channel }}
          VITE_PHREOX_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          (cd phreox-frontend && npm ci && npx vite build)
          mkdir -p pack out
          cp -r phreox-frontend/dist pack/site
          cp pterodactyl/web-server.mjs pack/server.mjs
          tar -czf "out/phreox-web-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.tar.gz" -C pack .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          if-no-files-found: error
          path: out/phreox-web-*.tar.gz

  publish:
    needs: [plan, desktop, android, service, backend, space, web]
    runs-on: ubuntu-latest
    # A dev release replaces the previous one: only the newest commit may publish, an older run is cancelled by a newer one.
    concurrency:
      group: publish-${{ needs.plan.outputs.channel == 'dev' && 'dev' || github.ref }}
      cancel-in-progress: ${{ needs.plan.outputs.channel == 'dev' }}
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # The natives (libopus, PortAudio) are artifacts too and come down as folders (linux-x64/, windows-x64/, ...). They are inside the jars and the apps
      # already; the release only gets the files.
      - name: Only files go into the release
        run: find files -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
      - name: Checksums
        working-directory: files
        run: sha256sum phreox-* > SHA256SUMS
      - name: Only one dev release at a time
        if: needs.plan.outputs.channel == 'dev'
        run: |
          gh release list -R "$RELEASES_REPO" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E -- '-dev\.[0-9a-f]{8}$' | grep -vx -- "$TAG" \
            | while read -r old; do gh release delete "$old" -R "$RELEASES_REPO" --cleanup-tag --yes; done
          # A rerun of the same commit replaces its own release.
          gh release delete "$TAG" -R "$RELEASES_REPO" --cleanup-tag --yes || true
      - name: Publish
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then flags=(--prerelease); else flags=(--latest); fi
          notes="Channel: $CHANNEL
          Built from https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          mapfile -t assets < <(find files -maxdepth 1 -type f)
          gh release create "$TAG" "${assets[@]}" -R "$RELEASES_REPO" --title "Phreox $TAG" --notes "$notes" "${flags[@]}"

  # Windows and macOS runners are scarce and can queue for a long time, so the release does not wait for them: the exe and the dmg
  # are added to the release when they are built (and listed in SHA256SUMS).
  desktop-win:
    needs: [plan, publish, natives]
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: libopus and PortAudio of every platform
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: natives-*
          merge-multiple: true
          path: phreox-backend/src/main/resources/natives
      - name: Backend jar and the Java runtime that ships with the app
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          node phreox-app/scripts/make-runtime.mjs
      - name: Make this checkout the app of the channel
        working-directory: phreox-app
        env:
          PHREOX_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: node scripts/prepare-channel.mjs "${{ needs.plan.outputs.channel }}" "${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install
        run: |
          (cd phreox-frontend && npm ci)
          (cd phreox-app && npm install --no-audit --no-fund)
      - name: Package
        working-directory: phreox-app
        run: npm run package:desktop
      - name: Add the exe to the release
        run: |
          FILE="$(ls phreox-app/release/phreox-*.exe | head -1)"
          tag="${{ needs.plan.outputs.tag }}"
          gh release upload "$tag" "$FILE" -R "$RELEASES_REPO" --clobber
          # SHA256SUMS lists it too, so the updater can verify the download. The Windows and the macOS build finish at about the same time and
          # both change this file: each one adds its line again until it is really in the file that is up there.
          name="$(basename "$FILE")"
          line="$(cd "$(dirname "$FILE")" && sha256sum "$name")"
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -rf sums check
            gh release download "$tag" -R "$RELEASES_REPO" -p SHA256SUMS -D sums --clobber
            { grep -v -- "  $name\$" sums/SHA256SUMS || true; echo "$line"; } > sums/new
            mv sums/new sums/SHA256SUMS
            gh release upload "$tag" sums/SHA256SUMS -R "$RELEASES_REPO" --clobber
            sleep $((RANDOM % 8 + 4))
            gh release download "$tag" -R "$RELEASES_REPO" -p SHA256SUMS -D check --clobber
            if grep -qxF -- "$line" check/SHA256SUMS; then exit 0; fi
          done
          echo "::error::$name is in the release but not in SHA256SUMS"
          exit 1

  desktop-mac:
    needs: [plan, publish, natives]
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: libopus and PortAudio of every platform
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: natives-*
          merge-multiple: true
          path: phreox-backend/src/main/resources/natives
      - name: Backend jar and the Java runtime that ships with the app
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          node phreox-app/scripts/make-runtime.mjs
      - name: Make this checkout the app of the channel
        working-directory: phreox-app
        env:
          PHREOX_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: node scripts/prepare-channel.mjs "${{ needs.plan.outputs.channel }}" "${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install
        run: |
          (cd phreox-frontend && npm ci)
          (cd phreox-app && npm install --no-audit --no-fund)
      - name: Package
        working-directory: phreox-app
        run: npm run package:desktop
      - name: Add the dmg to the release
        run: |
          FILE="$(ls phreox-app/release/phreox-*.dmg | head -1)"
          tag="${{ needs.plan.outputs.tag }}"
          gh release upload "$tag" "$FILE" -R "$RELEASES_REPO" --clobber
          # SHA256SUMS lists it too, so the updater can verify the download. The Windows and the macOS build finish at about the same time and
          # both change this file: each one adds its line again until it is really in the file that is up there.
          name="$(basename "$FILE")"
          line="$(cd "$(dirname "$FILE")" && shasum -a 256 "$name")"
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -rf sums check
            gh release download "$tag" -R "$RELEASES_REPO" -p SHA256SUMS -D sums --clobber
            { grep -v -- "  $name\$" sums/SHA256SUMS || true; echo "$line"; } > sums/new
            mv sums/new sums/SHA256SUMS
            gh release upload "$tag" sums/SHA256SUMS -R "$RELEASES_REPO" --clobber
            sleep $((RANDOM % 8 + 4))
            gh release download "$tag" -R "$RELEASES_REPO" -p SHA256SUMS -D check --clobber
            if grep -qxF -- "$line" check/SHA256SUMS; then exit 0; fi
          done
          echo "::error::$name is in the release but not in SHA256SUMS"
          exit 1
