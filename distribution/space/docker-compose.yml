services:
  space:
    image: eclipse-temurin:25-jre
    working_dir: /app
    command: ["java", "-XX:+UseZGC", "-XX:MaxRAMPercentage=70", "-XX:+ExitOnOutOfMemoryError", "-jar", "phreox-space.jar"]
    restart: unless-stopped
    # The console of the server: docker attach <container> (leave it with Ctrl+P Ctrl+Q), or one command at a time with
    # docker compose exec space java -jar phreox-space.jar <command>
    stdin_open: true
    tty: true
    ports:
      - "${PHREOX_SPACE_BIND:-0.0.0.0}:${PHREOX_SPACE_PORT:-8082}:8082"
    environment:
      PHREOX_SPACE_HOST: 0.0.0.0
      PHREOX_SPACE_PORT: "8082"
      PHREOX_SPACE_DATA_DIR: /data
      PHREOX_SPACE_CONFIG: /app/space.properties
    volumes:
      - ./phreox-space.jar:/app/phreox-space.jar:ro
      - ./space.properties:/app/space.properties:ro
      - space-data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  space-data:
