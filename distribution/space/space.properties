# UTF-8 Java properties. Environment variables override these values.
# Set your public HTTPS address before starting. The server needs no account: it registers with its own key (data/node.key).
PHREOX_SPACE_HOST=0.0.0.0
PHREOX_SPACE_PORT=8082
PHREOX_SPACE_DATA_DIR=./data
PHREOX_SPACE_SERVICE_URL=https://service.phreox.talk
PHREOX_SPACE_PUBLIC_URL=https://space.example.com
# Name of the space the server makes at its first start. Rename it later in the console: space rename <name>
PHREOX_SPACE_NAME=My Space
# Optional service public key pin, Base64 Ed25519.
PHREOX_SPACE_SERVICE_KEY=

# Defaults applied when creating a NEW space on this node.
PHREOX_SPACE_DEFAULT_CATEGORY=Text
PHREOX_SPACE_DEFAULT_CHANNEL=general
# Optional additional MLS-private channel. Empty disables it.
PHREOX_SPACE_DEFAULT_PRIVATE_CHANNEL=
PHREOX_SPACE_OWNER_ROLE=Owner
PHREOX_SPACE_MODERATOR_ROLE=Moderator
PHREOX_SPACE_MEMBER_ROLE=Member

# Operator upload ceiling in bytes. The verified Volt tier also applies.
PHREOX_SPACE_MAX_FILE_BYTES=2147483648
# Database flush interval, 1 to 300 seconds.
PHREOX_SPACE_FLUSH_SECONDS=5
# Additional browser app origins, comma separated, no trailing slash.
PHREOX_SPACE_ORIGINS=
