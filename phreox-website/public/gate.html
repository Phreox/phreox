<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07080e" />
    <title>Phreox</title>
    <link rel="icon" type="image/png" href="/phreox-logo.png" />
    <link rel="stylesheet" href="/gate.css" />
  </head>
  <body>
    <div class="aurora"><span style="top:-20%;right:-15%;width:46rem;height:46rem"></span><span style="top:-5%;right:0%;width:30rem;height:30rem;animation-delay:-9s"></span></div>

    <main>
      <form id="form" autocomplete="on">
        <img src="/phreox-logo.png" alt="" width="56" height="56" />

        <!-- The first step: who you are. -->
        <div id="step-login" class="step">
          <h1 data-de="Phreox ist bald da" data-en="Phreox is coming soon">Phreox ist bald da</h1>
          <p class="lead" data-de="Die Seite ist im Moment nur für das Team. Melde dich mit deinem Phreox-Account an." data-en="The site is for the team only right now. Log in with your Phreox account.">Die Seite ist im Moment nur für das Team. Melde dich mit deinem Phreox-Account an.</p>

          <label><span data-de="Benutzername" data-en="Username">Benutzername</span><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required /></label>
          <label><span data-de="Passwort" data-en="Password">Passwort</span><input id="password" name="password" type="password" autocomplete="current-password" required /></label>
        </div>

        <!-- The second step, only after the right password and only until the page is loaded again: the code, one box per digit. -->
        <div id="step-code" class="step" hidden>
          <h1 data-de="Bestätige deine Anmeldung" data-en="Confirm your login">Bestätige deine Anmeldung</h1>
          <p class="lead" id="code-label"></p>
          <div id="code" class="code" role="group">
            <input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="1" />
            <input inputmode="numeric" autocomplete="off" maxlength="1" aria-label="2" />
            <input inputmode="numeric" autocomplete="off" maxlength="1" aria-label="3" />
            <input inputmode="numeric" autocomplete="off" maxlength="1" aria-label="4" />
            <input inputmode="numeric" autocomplete="off" maxlength="1" aria-label="5" />
            <input inputmode="numeric" autocomplete="off" maxlength="1" aria-label="6" />
          </div>
          <button type="button" id="mail" class="link" hidden data-de="Code per E-Mail senden" data-en="Send a code by email">Code per E-Mail senden</button>
        </div>

        <p id="error" role="alert"></p>
        <button type="submit" id="submit" data-de="Anmelden" data-en="Log in">Anmelden</button>
        <button type="button" id="back" class="link" hidden data-de="Zurück" data-en="Back">Zurück</button>
      </form>
    </main>

    <script src="/gate.js"></script>
  </body>
</html>
