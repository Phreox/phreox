[package]
name = "phreox-presence"
version = "0.1.0"
edition = "2021"
description = "Discord Rich Presence for Phreox: detects running games from Discord's detectable list and Steam libraries, and sends them over Discord's local IPC."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"
